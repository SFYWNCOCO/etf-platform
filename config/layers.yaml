# Layer → category mapping for composite weighted score.
# Used by pipeline._weighted_composite() to map 21+ layers into 8 categories
# (供给侧/资金面/信号面/需求面/周期面/风控面/增强面/行为面).
#
# Same 8-dimension categories as decision/screener.py
# Added: L21_Behavior entries from k180 investment psychology layer
# Added: three_layer_index for k105 defensive/cycle/growth architecture

layer_to_category:
  # === 供给侧 ===
  L3_Material: 供给侧
  L4_SupplyChain: 供给侧
  L5_Tech: 供给侧
  L6_Politics: 供给侧
  L7_Irreplaceable: 供给侧
  # === 资金面 ===
  L8_CapitalFlow: 资金面
  L24_DipFlow: 资金面
  # === 信号面 ===
  L9_Signals: 信号面
  L16_LiveSignals: 信号面
  L23_Micro: 信号面
  # === 需求面 ===
  L10_Demand: 需求面
  L11_SectorRisk: 需求面
  # === 周期面 ===
  L12_PoliticalRisk: 周期面
  L13_MacroCycle: 周期面
  L22_Pendulum: 周期面
  # === 风控面 ===
  L14_StoicRisk: 风控面
  L18_VaR: 风控面
  L20_OptionVol: 风控面
  # === 增强面 ===
  L15_StateSim: 增强面
  L17_Factor: 增强面
  L19_FXChannel: 增强面
  # === 行为面 (k180 investment psychology) ===
  L21_Behavior: 行为面
  L21_Herding: 行为面
  L21_Disposition: 行为面
  L21_Overreaction: 行为面
  L21_Contrarian: 行为面
  L21_Attention: 行为面

